name: Build plugin

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Verify release files
        shell: bash
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          echo "Build artifacts verified."
